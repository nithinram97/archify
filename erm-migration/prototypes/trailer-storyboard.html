// ---------- Mock app screens drawn on canvases ----------

if (S === 1) {

  wall(0);
  camera.position.set(0, 0.3, 9.5); camera.lookAt(0, 0, -1);
  caption('Every quarter, your risk reporting runs through ERM.', 'Your ERM');
}
if (S === 3) {
  wall(0.6);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.08, 16, 100, Math.PI * 1.4), new THREE.MeshBasicMaterial({ color: '#94a3b8' }));
  ring.position.set(0, 0, 3); ring.rotation.z = 0.6; scene.add(ring);
  camera.position.set(0, 0.3, 9.5); camera.lookAt(0, 0, -1);
  caption('Waiting for tabs to load. Hunting for the right dashboard.', 'Until now');
}
if (S === 4) {
  overlay('statement', 'So we rebuilt it.<br><span>From the ground up.</span>');
}
if (S === 5) {
  rings(); stars(1600, '#cbd5e1', 0.05);
  camera.position.set(0, 0, 14); camera.lookAt(0, 0, 0);
  bloom = { strength: 1.2, radius: 0.6, threshold: 0.1 };
  overlay('intro', 'Introducing');
  overlay('logo', 'ERM <span>2.0</span>');
}
if (S === 6) {
  // 105 features, each one ticked off.
  for (let r = 0; r < 7; r++) for (let c = 0; c < 15; c++) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.62, 0.12), new THREE.MeshStandardMaterial({ color: '#15803d', emissive: '#16a34a', emissiveIntensity: 0.35 }));
    t.position.set((c - 7) * 0.78, (3 - r) * 0.78, 0); t.rotation.y = 0.15; scene.add(t);
  }
  camera.position.set(-2.2, 0.9, 12.5); camera.lookAt(0, 0.7, 0);
  bloom = { strength: 0.5, radius: 0.4, threshold: 0.4 };
  overlay('count', '105 / 105');
  caption('Every feature you rely on, carried over and checked one by one.', 'Nothing lost');
}
if (S === 7) {
  const names = ['Dashboard switcher', 'Link to any tab', 'Slideshow mode', 'Criticality-differs filter', 'Category filters', 'Columns that remember', 'New one-pager layout', 'Selection shortcuts', 'Risks by ID or title', 'Report classification and cover', 'Permissions on locked versions'];
  names.forEach((n, i) => { const a = i / names.length * Math.PI * 2; label(n, new THREE.Vector3(Math.cos(a) * 6.2, Math.sin(a) * 3.1, Math.sin(a) * -1.5)); });
  const ring = new THREE.Mesh(new THREE.TorusGeometry(6.2, 0.03, 12, 200), new THREE.MeshBasicMaterial({ color: '#ec4f8f' })); ring.scale.set(1, 0.5, 1); scene.add(ring);
  stars(900, '#475569', 0.05);
  camera.position.set(0, 0, 15); camera.lookAt(0, 0, 0);
  bloom = { strength: 0.8, radius: 0.5, threshold: 0.2 };
  overlay('eleven', '11<small>new features</small>');
}
if (S === 8) single(drawSearch, 7.2, 4.4, 'Find any dashboard in seconds.', 'New · Dashboard switcher');
if (S === 9) {
  const a = screen(drawShare, 4.6, 2.9); a.position.set(-3.2, 0.5, 0.6); a.rotation.y = 0.28; scene.add(a);
  const b = screen(drawSlide, 6, 3.4, { glow: '#6366f1' }); b.position.set(2.6, 0.4, -1.4); b.rotation.y = -0.2; scene.add(b);
  label('Link to any tab', new THREE.Vector3(-3.2, -1.3, 0.6));
  label('Slideshow mode', new THREE.Vector3(2.6, -1.6, -1.4));
  camera.position.set(0, 0.6, 10); camera.lookAt(0, 0.2, 0);
  caption('Share a link to any tab. Present in slideshow mode.', 'New');
}
if (S === 10) single((g, w, h) => drawTable(g, w, h, { resize: true, chips: true }), 7.2, 4.3, 'Filter the way you think. Columns remember your width.', 'New · Filters and columns');
if (S === 11) single(drawOnePagerPick, 7.2, 4.3, 'A new one-pager layout. Pick risks in one click.', 'New · One-pager', -0.16);
if (S === 12) single(drawReport, 7.2, 4.3, 'Reports with classification and an optional cover page.', 'New · Reports');
if (S === 13) single(drawLocked, 7.2, 4.3, 'Released dashboard? Update permissions without unlocking it.', 'New · Locked versions', -0.16);
if (S === 14) single(drawToast, 7.2, 4.3, 'Every save confirmed. Every list up to date.', 'Better every day');
if (S === 15) {
  stars(1200, '#64748b', 0.05);
  camera.position.set(0, 0, 14); camera.lookAt(0, 0, 0);
  overlay('quote q1', '“User interface and performance have significantly improved.”');
  overlay('who w1', 'ERM Centre of Competence');
  overlay('quote q2', '“Great new features that make navigation easier and give us a much clearer view of our R&amp;O data.”');
  overlay('who w2', 'Risk and Opportunity Manager');
}
if (S === 16) {
  rings(); stars(1400, '#94a3b8', 0.06);
  camera.position.set(0, 0, 14); camera.lookAt(0, 0, 0);
  bloom = { strength: 1.2, radius: 0.6, threshold: 0.1 };
  overlay('logo', 'ERM <span>2.0</span>');
  overlay('tag', 'Everything you rely on. Faster and easier.');
  overlay('soon', 'Coming soon');
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), bloom.strength, bloom.radius, bloom.threshold));
composer.addPass(new OutputPass());
composer.render();
labels.render(scene, camera);
window.__done = true;
</script>
