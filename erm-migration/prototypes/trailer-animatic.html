  bar.innerHTML = `<div class="ind" style="left:${x}px"></div>` + TABS.map((t, i) => `<div class="${i === Math.round(active + slide) ? 'on' : ''}" style="background:${i === Math.round(active + slide) ? 'transparent' : ''}">${t[1]}</div>`).join('');
}
function shotTabs(u) {
  setBloom(0.25, 0.4, 0.95); scene.background = col('#070b16');
  stars(500, '#334155', 0.04, [40, 22, 30], 9);
  const k = Math.min(5, Math.floor(u / 4)), v = u - k * 4;
  const [, name, line] = TABS[k];
  drawApp(41 + u);
  appCam(41 + u);
  tabBar(k, k < 5 ? ss(4 - PUSH, 4.0, v) : 0, ss(0.1, 0.5, u) * (1 - ss(24 - PUSH, 24, u)));
  caption(line, name, v, 0.4, 3.6);
}
function shotLayout(u) {
  setBloom(0.35, 0.4, 0.9); scene.background = col('#070b16');
  stars(500, '#334155', 0.04, [40, 22, 30], 9);
  drawApp(65 + u);
  appCam(65 + u);
  caption('Build your own one-pager layout.', 'New', u, 0.6, 5.6);
}
function shotSlideshow(u) {
  setBloom(0.3, 0.4, 0.92); scene.background = col('#070b16');
  stars(500, '#334155', 0.04, [40, 22, 30], 9);
  drawApp(71 + u);
  appCam(71 + u);
  caption('Present straight from ERM, in slideshow mode.', 'New', u, 2.6, 5.4);
  fadeOp = ss(5.45, 6.0, u);
}

// ---------- Shots 10-11: brought to you by, then the end card ----------
const SKY_A = 772 / 193.2, MARK_A = (IMG.cmark ? IMG.cmark.width / IMG.cmark.height : 0.807);
const meas = document.createElement('span'); meas.className = 'mich'; meas.style.cssText = 'position:absolute;visibility:hidden;font-size:100px'; meas.textContent = 'CLAIRVOYANT'; document.body.appendChild(meas);
const MICH_W = meas.getBoundingClientRect().width / 100; meas.remove();
// Clairvoyant lockup proportions (brand kit): wordmark 52/272 of the mark height, gap 64/272.
const cvWidth = (mh) => mh * MARK_A + mh * 64 / 272 + MICH_W * mh * 52 / 272;
function creditLayout(p) {
  const A = (() => { const sh = 66, mh = 118, sw = sh * SKY_A, cw = cvWidth(mh), gap = 64, xw = 26;
    const total = sw + gap + xw + gap + cw, x0 = 640 - total / 2;
    return { hy: 236, hs: 16, hl: 6, sh, sx: x0 + sw / 2, sy: 352, xx: x0 + sw + gap + xw / 2, xy: 350, xs: 30, mh, cl: x0 + sw + gap + xw + gap, cy: 352 }; })();
  const B = { hy: 84, hs: 12, hl: 4.8, sh: 50, sx: 428, sy: 146, xx: 640, xy: 143, xs: 24, mh: 70, cl: 852 - cvWidth(70) / 2, cy: 146 };
  const o = {}; for (const k in A) o[k] = lerp(A[k], B[k], p); return o;
}
function credits(L, { head = 1, sky = 1, x = 1, mark = 1, chars = 11, caret = false }) {
  abs('Brought to you by', 'credit', `left:0;right:0;text-align:center;top:${L.hy}px;transform:translateY(-50%);font-size:${L.hs}px;letter-spacing:${L.hl}px;opacity:${head}`);
  if (IMG.skywise) abs(`<img src="${IMG.skywise.src}" style="height:${L.sh}px;display:block">`, '', `left:${L.sx}px;top:${L.sy}px;transform:translate(-50%,-50%) scale(${lerp(0.92, 1, sky)});opacity:${sky}`);
  abs('×', '', `left:${L.xx}px;top:${L.xy}px;transform:translate(-50%,-50%);font-size:${L.xs}px;color:#94a3b8;opacity:${x}`);
  const fs = L.mh * 52 / 272, gap = L.mh * 64 / 272;
  const word = 'CLAIRVOYANT'.slice(0, chars);
  abs(`<img src="${IMG.cmark ? IMG.cmark.src : ''}" style="height:${L.mh}px;display:block;opacity:${mark};transform:scale(${lerp(0.6, 1, eob(mark))})">` +
      `<span class="mich" style="font-size:${fs}px;margin-left:${gap}px">${word}${caret ? '<span class="caret"></span>' : ''}</span>`,
      '', `left:${L.cl}px;top:${L.cy}px;transform:translateY(-50%);display:flex;align-items:center`);
}
const E0 = 77 + 5.8; // end card elements start (global time)
function endCard(t) {
  const e = t - E0; if (e < -0.05) return;
  const rings = [[4.6, 0.06, '#ec4f8f', [1.35, 0.15, 0], 1.25], [5.4, 0.03, '#6366f1', [1.45, -0.2, 0.25], 1.2]];
  rings.forEach(([r, tb, c, rot, sc], i) => {
    const m = new THREE.Mesh(new THREE.TorusGeometry(r, tb, 16, 160), basic(c));
    const s = eob(lin(0.0 + i * 0.12, 1.0 + i * 0.12, e)) * sc;
    m.rotation.set(rot[0] - (1 - clamp(e)) * 0.6, rot[1] + e * 0.02, rot[2] + e * 0.015 * (i ? -1 : 1)); m.scale.set(s + 0.001, s + 0.001, 1); scene.add(m);
  });
  const lo = ss(0.5, 1.0, e);
  text('logo', 'ERM <span>2.0</span>', lo, `transform:scale(${lerp(0.9, 1, lo)})`);
  text('tag', 'Everything you rely on. Faster and easier.', ss(1.8, 2.3, e));
  text('soon', 'Coming soon', ss(2.6, 3.1, e));
}
function shotCredits(u, t) {
  setBloom(lerp(0.5, 1.2, ss(5.8, 6.8, u)), 0.6, lerp(0.4, 0.1, ss(5.8, 6.8, u))); scene.background = col('#070b16');
  stars(1400, '#94a3b8', 0.06, [40, 22, 30], 3).position.z = u * 0.25;
  const p = ss(5.4, 6.6, u);
  const typed = Math.round(11 * lin(2.2, 3.4, u));
  credits(creditLayout(p), { head: ss(0.4, 1.0, u), sky: ss(0.9, 1.5, u), x: ss(1.4, 1.8, u), mark: ss(1.6, 2.1, u), chars: typed, caret: u > 2.1 && u < 4.2 && (u < 3.4 || Math.floor(u * 4) % 2 === 0) });
  endCard(t);
  look(V(0, 0, lerp(14.4, 14, ss(5.8, 7, u))), V(0, 0, 0));
  flashOp = win(u, 6.45, 6.95, 0.2) * 0.45;
  fadeOp = 1 - ss(0, 0.4, u);
}
function shotEnd(u, t) {
  setBloom(1.2, 0.6, 0.1); scene.background = col('#070b16');
  stars(1400, '#94a3b8', 0.06, [40, 22, 30], 3).position.z = (u + 7) * 0.25;
  credits(creditLayout(1), {});
  endCard(t);
  look(V(0, 0, lerp(14, 13.4, ss(0, 10, u))), V(0, 0, 0));
  fadeOp = ss(9.0, 10.0, u);
}

// ---------- Frame ----------
const FN = { globe: shotGlobe, siglums: shotSiglums, wall: shotWall, wait: shotWait, turn: shotTurn, gate: shotGate, tabs: shotTabs, layout: shotLayout, slideshow: shotSlideshow, credits: shotCredits, end: shotEnd };
let flashOp = 0, fadeOp = 0;
function clearScene() {
  scene.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  while (scene.children.length) scene.remove(scene.children[0]);
  ov.innerHTML = ''; lab.innerHTML = '';
}
window.renderAt = (t) => {
  clearScene(); flashOp = 0; fadeOp = 0;
  const s = SHOTS.find((x) => t < x[2]) || SHOTS[SHOTS.length - 1];
  FN[s[0]](t - s[1], t);
  if (t < 0.8) fadeOp = Math.max(fadeOp, 1 - ss(0, 0.8, t));
  flashEl.style.opacity = flashOp; fadeEl.style.opacity = fadeOp;
  composer.render(); labels.render(scene, camera);
  return s[0];
};
window.renderAt(Number(Q.get('t') || 2));
window.__done = true;
</script>
